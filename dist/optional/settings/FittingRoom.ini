; Fitting Room - Data\SKSE\Plugins\FittingRoom.ini
;
; Starting settings: LORE-FRIENDLY (the Seamstone, styling paid out of it, and a look only shows over real gear).
;
; The installer wrote this file for the playstyle you picked, and that is ALL
; it did: these are ordinary settings, not a mode. Every key below is also in
; the in-game panel (the FLICK sidebar, under Fitting Room), and the panel
; rewrites this file when you change something. Nothing is locked in, and the
; transmog itself works exactly the same either way.
;
; Full documentation: https://github.com/maartenharms/fitting-room

[General]
; What applying outfit changes costs, ESO-style. Previewing is always free;
; you only pay when you commit.
;   0 = nothing
;   1 = gold, iGoldPerSlot per changed slot (below)
;   2 = the Seamstone's charge, iChargePerSlot per changed slot, refilled
;       with filled soul gems
; Mode 2 keeps the charge per character in your save, so it works with or
; without FittingRoomLore.esp. A new stone starts empty and an empty stone
; will not let you apply changes, so feed it a soul gem before your first
; restyle. Replaces the older bUseGold, which is still read on saves that
; have it and no iCostMode.
iCostMode=2

; Require the Seamstone in your pockets before the editor will open. The
; Seamstone is the lore item from FittingRoomLore.esp: a carryable Alteration
; focus, sold by Farengar Secret-Fire in Dragonsreach. 1 = the stone is your
; key, so buy it before the hotkey does anything; 0 = the hotkey always opens
; the editor and the stone is just a second way in. With no
; FittingRoomLore.esp installed this key does nothing at all.
bRequireSeamstone=1

; A style only shows while you are wearing real gear under some part of it,
; instead of dressing you out of nothing. Shields have always worked this way.
; 1 = you have to own and wear something for the look to render; 0 = wear
; whatever you like over whatever you have on, including nothing.
;
; One piece can cover several slots at once, and wearing gear under any one of
; them is enough, so a robe still covers the bare slots its sleeves span.
;
; Turning this ON can stop parts of outfits you already saved from showing.
bRequireWornForStyles=1

; The style browser only offers looks this character has actually owned the
; gear for, and applying one it has not is refused. The same sentence as the
; gate above, one step earlier: own it, then wear it.
;
; This is SEPARATE from what styling costs. iCostMode decides whether the
; change bills you; this decides whether the look was yours to pick at all.
;
; 1 = the browser is this character's own wardrobe; 0 = every look you have
; saved is offered from the start. A look is never taken back out of the
; collection, so turning this on later starts you from what you already have.
bCollectionOnly=1

; Colours have to be EARNED before you can pick them, by what your character
; has actually done: quests finished, ruins cleared, skills raised, and
; Skyrim's own counters. A colour you have not won yet shows in the grid with
; a padlock and says what it takes, so the palette reads as something to work
; through rather than a wall of swatches.
;
; This is SEPARATE from what styling costs. iCostMode above decides whether
; changing an outfit bills you; this decides whether the colour was yours to
; pick in the first place. The two are independent on purpose, because
; "dressing up is free but the rare dyes are earned" and its opposite are
; both reasonable ways to play.
;
; 1 = earn them; 0 = every installed colour is yours from the start. Colours
; already earned are never taken back, so turning this on later starts you
; from what you have rather than from nothing.
bDyeUnlocks=1

; Which migrations this file has already been through. Do not edit: the mod
; writes it, and clearing it asks for the one-time fixes to run again.
iSettingsVersion=4

; Which installer answers this file has taken, so a fresh install's choices
; land even when an older FittingRoom.ini in Overwrite or a mod above shadows
; the one the installer wrote. The installer fills it in. Do not edit.
sInstallerStamp=TEMPLATE

[Lore]
; Gold charged per changed slot while iCostMode=1. 0 disables.
iGoldPerSlot=100

; Gold charged per changed dye channel while iCostMode=1. 0 disables, which
; is the default: gold shipped billing slots only, and turning this on by
; itself would reprice a game you were already playing. This is NOT
; iDyeCost, which is what unlocking a colour costs.
iGoldPerDye=0

; Seamstone charge spent per changed slot while iCostMode=2. 0 disables.
iChargePerSlot=100

; Seamstone charge spent per changed dye channel while iCostMode=2, on top
; of the slots. Dyeing an eight-piece armour costs eight of these.
iChargePerDye=50

; How much charge the Seamstone holds when full. Lowering this leaves a
; stone that is already fuller alone rather than draining it to the new
; ceiling.
iSeamstoneCapacity=5000

[Rules]
; Auto-switching (the Rules tab): how often the game re-checks your rules
; when nothing else (a menu closing, combat starting, gear changing) already
; triggered a check.
fHeartbeatSeconds=2.0

; Minimum seconds an auto-switched outfit stays on before a new rule match
; is allowed to replace it. Skipped the moment combat starts, so a combat
; rule always shows up promptly.
fMinDwellSeconds=5.0

[Pages]
; Which pages appear in the rail down the left of the editor. Every one is on
; here; the installer's page question only ever switches some of them off, and
; the Pages tab in the editor's own settings is the last word either way.
;
; A page switched off here is one you chose to hide. A page that is missing
; anyway needs a mod you do not have, which is a different thing: hover its tile
; and it will say which. Hiding a page never undoes anything it wrote.
bStyles=1
bDye=1
bBodies=1
bShape=1
bOverlays=1
bPresets=1
; ⚠ ON SINCE 1.1.7, WITH THE TWO [Compat] KEYS AT THE BOTTOM OF THIS FILE. The
; three of them are one decision, so they ship together; the installer's
; "Leave my face alone" answer turns all three off. Hiding this page is one
; tick here or in the settings panel, and hiding a page never undoes anything
; it wrote.
bLooks=1
bRules=1

[UI]
; How large the whole editor draws, as a fraction of its full size. The slider
; in the settings panel writes this back, so it is only a starting point.
;
; The installer states it rather than leaving it out. An absent key takes the
; value built into the DLL, and that value has changed four times: it was 0.8
; when the mod first released, 0.7 from August, 0.65 from mid August, and 0.63
; since. Anyone who ran an older build has the number of that day saved here,
; which is why the mod also resets a stored 0.8, 0.7 or 0.65 once, unless you
; picked it yourself.
fUiScale=0.63

; The corner shape the editor draws its own panels and buttons with.
; 1 is the carved corner, 2 is the plain one. There is no third option.
;
; Stated here for the same reason fUiScale is: an absent key takes whichever
; default the DLL carries that month, and this one has changed more than once.
iFrameStyle=1

; Show only the body presets built for the body your character wears.
;
; On, a body list leaves out presets meant for a different body. Off, you see
; every preset you have installed. The settings panel calls this "Only offer
; bodies that fit" and you can change it there at any time.
;
; Stated here because it was not, and that cost a player their list. The key
; was absent from every flavour, so the value came from the DLL and there was
; no line in this file to find or to turn off.
bBodyFitFilter=1

[Compat]
; How much of your character's face Fitting Room is allowed to write.
;
; Both of these ship ON as of 1.1.7. They were off from 2026-08-29, after two
; players lost a face to them in one night: eyes replaced with ones they had
; not chosen, and a second face drawn over the first. 1.1.7 fixed what caused
; that, and the installer's "Leave my face alone" answer still turns both off.
; Outfits, dyes, overlays, shapes and the editor all work exactly the same
; either way. 1.1.7 also moves an older file onto these once; what you set
; after that is kept.
;
; Put a look's EYES, BROWS AND FACIAL HAIR back after something else replaces
; them. Off, RaceMenu and the game's own head build get the last word.
; Your colours are a separate setting below and they are kept either way.
bReassertAppearance=1

; Let applying a look load its RaceMenu preset and switch your race and sex.
; Off, a look still brings its outfit, dyes, body, shape, skin and overlays.
bLooksRaceMenu=1

; Put the colours Fitting Room painted back after the game rebuilds your head
; over them, which is what happens every time you walk through a door. Off, your
; head keeps the game's paint while your body keeps the mod's, so the two stop
; matching and the head can go pale. Colours only: this never swaps a head part,
; which is why it is safe to leave on and is not part of the face question above.
;
; ON. It was off in 1.1.3 and 1.1.4, folded in with the face settings, and that
; was the bug rather than the caution: two players reported a head that stopped
; matching the body after an interior switch.
bKeepColoursAfterRebuild=1
